---
# The package is deleted with kapp, as kapp-controller does when deleting the PackageInstall:
# `kctrl dev --delete` doesn't delete the resources of a local installation.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
delete:
  - apiVersion: v1
    kind: Secret
    name: hetzner
    namespace: cert-manager
commands:
  - script: kapp delete -a cert-manager-webhook-hetzner.app -n tests -y
