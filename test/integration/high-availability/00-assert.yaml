# The webhook is ready.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-hetzner
  namespace: cert-manager
spec:
  replicas: 2
status:
  readyReplicas: 2
# The Kubernetes API server reaches the webhook over TLS, with the certificate issued by cert-manager,
# so that cert-manager can send it the DNS-01 challenges.
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.hetzner.kadras.io
status:
  conditions:
  - type: Available
    status: "True"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cert-manager-webhook-hetzner
  namespace: cert-manager
status:
  currentHealthy: 2
